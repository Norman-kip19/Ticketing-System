<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#edf5fb">
    <title>Clear Day — To-do list</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="eyebrow">A little progress, every day</p>
        <h1>Clear Day</h1>
        <p class="intro">Make space for what matters. One task at a time.</p>
      </header>

      <section class="task-card" aria-labelledby="list-heading">
        <form class="task-form" id="task-form">
          <label class="sr-only" for="task-input">New task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="160"
            placeholder="What would you like to do?"
            autocomplete="off"
            required
          >
          <button class="add-button" type="submit">Add task</button>
        </form>

        <div class="list-heading">
          <h2 id="list-heading">Your tasks</h2>
          <span class="task-count" id="task-count" aria-live="polite"></span>
        </div>

        <ul class="task-list" id="task-list" aria-label="To-do tasks"></ul>
        <p class="empty-state" id="empty-state">Your list is clear. Add a task to get started.</p>
        <p class="save-message" id="save-message" role="status" aria-live="polite"></p>
      </section>

      <footer class="app-footer">Your tasks stay on this device.</footer>
    </main>
  </body>
</html>
